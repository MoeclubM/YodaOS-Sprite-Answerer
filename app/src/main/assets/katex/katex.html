<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <script src="file:///android_asset/katex/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #00ff66;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 4px 8px 180px 8px;
            will-change: transform;
            transform: translateY(0px);
            transition: transform 0.15s ease-out;
        }

        p, div, span, li, h1, h2, h3, table, td, th {
            color: #00ff66;
        }

        /* 极简紧凑行排版：彻底移除多余垂直空白，行间距紧凑自然 */
        .line {
            line-height: 1.45;
            font-size: 13.5px;
            word-wrap: break-word;
            word-break: break-word;
            margin-bottom: 2px;
        }

        /* 题号小标题上方仅保留 4px 轻微间隔 */
        .bold-title {
            font-weight: bold;
            color: #00ff66;
            margin-top: 4px;
            margin-bottom: 1px;
            display: inline-block;
        }

        .katex {
            color: #00ff66 !important;
            font-size: 1.08em;
            white-space: normal !important;
            word-wrap: break-word !important;
            display: inline-block;
        }

        .katex-html {
            white-space: normal !important;
            display: inline-block !important;
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            overflow-y: visible !important;
        }

        .katex .frac-line, .katex-display .frac-line {
            border-bottom-color: #00ff66 !important;
            border-bottom-style: solid !important;
            border-bottom-width: 0.04em !important;
            min-height: 1px !important;
            display: inline-block !important;
            width: 100% !important;
            background-color: transparent !important;
        }

        .katex .sqrt-line {
            border-top-color: #00ff66 !important;
            border-top-style: solid !important;
            border-top-width: 0.04em !important;
            background-color: transparent !important;
        }

        .katex .mord, .katex .mbin, .katex .mrel, .katex .mopen, .katex .mclose, .katex .mpunct, .katex .minner, .katex .mop {
            color: #00ff66 !important;
        }

        /* 核心修复：将块级公式的上下 margin 压缩到 0.1em，彻底杜绝公式与文字之间的巨大间隙 */
        .katex-display {
            margin: 0.1em 0 !important;
            padding: 1px 0 !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: visible !important;
            white-space: normal !important;
        }

        .katex-display > .katex {
            white-space: normal !important;
            text-align: left !important;
            display: block !important;
        }
    </style>
</head>
<body>
    <div id="scroll-wrapper">
        <div id="content"></div>
    </div>
    <script>
        var currentScrollY = 0;
        var maxScrollY = 0;
        var autoScrollTimer = null;
        var isAutoScrolling = false;
        var resumeAutoScrollTimer = null;

        var wrapper = document.getElementById('scroll-wrapper');
        var container = document.getElementById('content');

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderMarkdown(md) {
            currentScrollY = 0;
            updateTransform(0, false);

            if (!md || !md.trim()) {
                container.innerHTML = '';
                return;
            }

            try {
                // 1. 彻底过滤连续空行，所有内容紧凑排列
                var lines = md.split(/\r?\n/);
                var htmlParts = [];

                for (var i = 0; i < lines.length; i++) {
                    var rawLine = lines[i];
                    var trimmed = rawLine.trim();

                    // 遇到纯空行直接忽略，绝不产生空 div 或占位高度
                    if (!trimmed) {
                        continue;
                    }

                    var processed = escapeHtml(rawLine);
                    processed = processed.replace(/\*\*(.*?)\*\*/g, '<span class="bold-title">$1</span>');

                    htmlParts.push('<div class="line">' + processed + '</div>');
                }

                container.innerHTML = htmlParts.join('');

                // 2. 调用 KaTeX auto-render 渲染数学公式
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                container.innerText = md;
            }

            setTimeout(calculateMaxScroll, 120);
            startAutoScrollIfNeeded();
        }

        function calculateMaxScroll() {
            var wrapperHeight = wrapper.offsetHeight;
            var windowHeight = window.innerHeight;
            maxScrollY = Math.max(0, wrapperHeight - windowHeight);
        }

        function updateTransform(y, animate) {
            if (animate) {
                wrapper.style.transition = 'transform 0.15s ease-out';
            } else {
                wrapper.style.transition = 'none';
            }
            wrapper.style.transform = 'translateY(' + (-y) + 'px)';
        }

        window.manualScroll = function(deltaY) {
            calculateMaxScroll();
            if (maxScrollY <= 0) return;

            isAutoScrolling = false;
            if (resumeAutoScrollTimer) {
                clearTimeout(resumeAutoScrollTimer);
            }

            currentScrollY += deltaY;
            if (currentScrollY < 0) currentScrollY = 0;
            if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;

            updateTransform(currentScrollY, true);

            resumeAutoScrollTimer = setTimeout(function() {
                isAutoScrolling = true;
            }, 6000);
        };

        function startAutoScrollIfNeeded() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            setTimeout(function() {
                calculateMaxScroll();
                if (maxScrollY > 20) {
                    isAutoScrolling = true;
                    autoScrollTimer = setInterval(function() {
                        if (!isAutoScrolling) return;
                        if (currentScrollY >= maxScrollY) {
                            clearInterval(autoScrollTimer);
                            autoScrollTimer = null;
                            isAutoScrolling = false;
                        } else {
                            currentScrollY += 0.35;
                            if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;
                            updateTransform(currentScrollY, false);
                        }
                    }, 50);
                }
            }, 3500);
        }
    </script>
</body>
</html>
