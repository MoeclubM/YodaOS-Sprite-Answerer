<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <script src="file:///android_asset/katex/auto-render.min.js"></script>
    <style>
        /* 仅顶层背景设为纯黑，绝不使用 * 覆盖，否则 KaTeX 分数线(frac-line)和边框会被抹黑隐藏！ */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #00ff66;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.85;
            padding: 6px 8px 160px 8px;
            overflow-x: hidden;
            overflow-y: scroll;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        /* 统一绿色高亮，允许 KaTeX 分数线正常绘制边框颜色 */
        p, div, span, li, h1, h2, h3, table, td, th {
            color: #00ff66;
        }

        /* 核心修复：KaTeX 公式分数线与边框显式赋予荧光绿颜色与 1.5px 粗细，彻底杜绝虚线/消失/遮挡 */
        .katex {
            color: #00ff66 !important;
            font-size: 1.12em;
            line-height: 1.6 !important;
            white-space: normal !important;
            word-wrap: break-word !important;
            padding-top: 4px !important;
            padding-bottom: 4px !important;
            display: inline-block;
        }

        .katex-html {
            white-space: normal !important;
            display: inline-block !important;
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            overflow-y: visible !important;
        }

        /* 修复分数线 (frac-line) 颜色与可见性 */
        .katex .frac-line, .katex-display .frac-line {
            border-bottom-color: #00ff66 !important;
            border-bottom-width: 1.5px !important;
            min-height: 1.5px !important;
            display: block !important;
            background-color: #00ff66 !important;
        }

        /* 修复根号与开方符号 */
        .katex .sqrt-line {
            border-top-color: #00ff66 !important;
            border-top-width: 1.5px !important;
            background-color: #00ff66 !important;
        }

        /* 修复矩阵边框与括号 */
        .katex .mord, .katex .mbin, .katex .mrel, .katex .mopen, .katex .mclose, .katex .mpunct, .katex .minner, .katex .mop {
            color: #00ff66 !important;
        }

        .katex-display {
            margin: 0.6em 0 !important;
            padding: 6px 0 !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: visible !important;
            white-space: normal !important;
        }

        .katex-display > .katex {
            white-space: normal !important;
            text-align: left !important;
            display: block !important;
        }

        .bold-title {
            font-weight: bold;
            color: #00ff66;
            margin-top: 6px;
            margin-bottom: 2px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        var autoScrollTimer = null;
        var isAutoScrolling = false;
        var resumeAutoScrollTimer = null;

        function parseSimpleMarkdown(md) {
            if (!md) return '';
            var lines = md.split('\n');
            var html = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                line = line.replace(/\*\*(.*?)\*\*/g, '<span class="bold-title">$1</span>');
                line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html.push(line);
            }
            return html.join('<br>');
        }

        function renderMarkdown(md) {
            var container = document.getElementById('content');
            if (!md || !md.trim()) {
                container.innerHTML = '';
                return;
            }
            try {
                container.innerHTML = parseSimpleMarkdown(md);
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                container.innerText = md;
            }

            startAutoScrollIfNeeded();
        }

        function startAutoScrollIfNeeded() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            // 延时 4 秒首屏静止等待，随后以 0.4px/50ms 极缓微步滚动
            setTimeout(function() {
                var scrollHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
                var clientHeight = window.innerHeight;
                if (scrollHeight > clientHeight + 30) {
                    isAutoScrolling = true;
                    autoScrollTimer = setInterval(function() {
                        if (!isAutoScrolling) return;
                        var current = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                        var maxScroll = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - window.innerHeight;
                        if (current >= maxScroll - 2) {
                            clearInterval(autoScrollTimer);
                            autoScrollTimer = null;
                            isAutoScrolling = false;
                        } else {
                            window.scrollBy(0, 0.4);
                        }
                    }, 50);
                }
            }, 4000);
        }

        // 高度精准的手动滚动接口
        window.manualScroll = function(deltaY) {
            isAutoScrolling = false;
            if (resumeAutoScrollTimer) {
                clearTimeout(resumeAutoScrollTimer);
            }
            
            window.scrollBy(0, deltaY);
            
            resumeAutoScrollTimer = setTimeout(function() {
                isAutoScrolling = true;
            }, 6000);
        };
    </script>
</body>
</html>
