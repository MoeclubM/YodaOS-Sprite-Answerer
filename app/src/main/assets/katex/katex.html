<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <script src="file:///android_asset/katex/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 外部视口固定 */
            background-color: #000000;
            color: #00ff66;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 核心内部滚动视口容器：使用硬件加速 transform: translateY 驱动滚动，100% 免疫任何 Android WebView 滚动失效！ */
        #scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            padding: 4px 6px 180px 6px;
            will-change: transform;
            transform: translateY(0px);
            transition: transform 0.15s ease-out;
        }

        p, div, span, li, h1, h2, h3, table, td, th {
            color: #00ff66;
        }

        .para {
            margin-bottom: 4px;
            line-height: 1.55;
            font-size: 13.5px;
        }

        .katex {
            color: #00ff66 !important;
            font-size: 1.08em;
            white-space: normal !important;
            word-wrap: break-word !important;
            display: inline-block;
        }

        .katex-html {
            white-space: normal !important;
            display: inline-block !important;
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            overflow-y: visible !important;
        }

        .katex .frac-line, .katex-display .frac-line {
            border-bottom-color: #00ff66 !important;
            border-bottom-style: solid !important;
            border-bottom-width: 0.04em !important;
            min-height: 1px !important;
            display: inline-block !important;
            width: 100% !important;
            background-color: transparent !important;
        }

        .katex .sqrt-line {
            border-top-color: #00ff66 !important;
            border-top-style: solid !important;
            border-top-width: 0.04em !important;
            background-color: transparent !important;
        }

        .katex .mord, .katex .mbin, .katex .mrel, .katex .mopen, .katex .mclose, .katex .mpunct, .katex .minner, .katex .mop {
            color: #00ff66 !important;
        }

        .katex-display {
            margin: 0.35em 0 !important;
            padding: 2px 0 !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: visible !important;
            white-space: normal !important;
        }

        .katex-display > .katex {
            white-space: normal !important;
            text-align: left !important;
            display: block !important;
        }

        .bold-title {
            font-weight: bold;
            color: #00ff66;
            margin-top: 5px;
            margin-bottom: 2px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="scroll-wrapper">
        <div id="content"></div>
    </div>
    <script>
        var currentScrollY = 0;
        var maxScrollY = 0;
        var autoScrollTimer = null;
        var isAutoScrolling = false;
        var resumeAutoScrollTimer = null;

        var wrapper = document.getElementById('scroll-wrapper');
        var container = document.getElementById('content');

        function parseCompactMarkdown(md) {
            if (!md) return '';
            var lines = md.split('\n');
            var html = [];
            var lastWasEmpty = false;
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) {
                    if (!lastWasEmpty) {
                        lastWasEmpty = true;
                    }
                    continue;
                }
                lastWasEmpty = false;
                line = line.replace(/\*\*(.*?)\*\*/g, '<span class="bold-title">$1</span>');
                line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html.push('<div class="para">' + line + '</div>');
            }
            return html.join('');
        }

        function renderMarkdown(md) {
            currentScrollY = 0;
            updateTransform(0, false);

            if (!md || !md.trim()) {
                container.innerHTML = '';
                return;
            }
            try {
                container.innerHTML = parseCompactMarkdown(md);
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                container.innerText = md;
            }

            setTimeout(calculateMaxScroll, 100);
            startAutoScrollIfNeeded();
        }

        function calculateMaxScroll() {
            var wrapperHeight = wrapper.offsetHeight;
            var windowHeight = window.innerHeight;
            maxScrollY = Math.max(0, wrapperHeight - windowHeight);
        }

        function updateTransform(y, animate) {
            if (animate) {
                wrapper.style.transition = 'transform 0.18s ease-out';
            } else {
                wrapper.style.transition = 'none';
            }
            wrapper.style.transform = 'translateY(' + (-y) + 'px)';
        }

        // 终极手动滚动接口：通过硬件加速 transform: translateY 精准推移
        window.manualScroll = function(deltaY) {
            calculateMaxScroll();
            if (maxScrollY <= 0) return;

            isAutoScrolling = false;
            if (resumeAutoScrollTimer) {
                clearTimeout(resumeAutoScrollTimer);
            }

            currentScrollY += deltaY;
            if (currentScrollY < 0) currentScrollY = 0;
            if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;

            updateTransform(currentScrollY, true);

            resumeAutoScrollTimer = setTimeout(function() {
                isAutoScrolling = true;
            }, 6000);
        };

        function startAutoScrollIfNeeded() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            setTimeout(function() {
                calculateMaxScroll();
                if (maxScrollY > 20) {
                    isAutoScrolling = true;
                    autoScrollTimer = setInterval(function() {
                        if (!isAutoScrolling) return;
                        if (currentScrollY >= maxScrollY) {
                            clearInterval(autoScrollTimer);
                            autoScrollTimer = null;
                            isAutoScrolling = false;
                        } else {
                            currentScrollY += 0.4;
                            if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;
                            updateTransform(currentScrollY, false);
                        }
                    }, 50);
                }
            }, 3500);
        }

        // 支持原生鼠标/触控板物理拖拽滚动 (Touch/Mouse Events 监听)
        var isDragging = false;
        var startDragY = 0;
        var startScrollY = 0;

        window.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                startDragY = e.touches[0].clientY;
                startScrollY = currentScrollY;
                isAutoScrolling = false;
            }
        }, { passive: false });

        window.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            var currentY = e.touches[0].clientY;
            var diff = startDragY - currentY;
            currentScrollY = startScrollY + diff;
            if (currentScrollY < 0) currentScrollY = 0;
            if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;
            updateTransform(currentScrollY, false);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', function(e) {
            isDragging = false;
            if (resumeAutoScrollTimer) clearTimeout(resumeAutoScrollTimer);
            resumeAutoScrollTimer = setTimeout(function() { isAutoScrolling = true; }, 6000);
        });

        window.addEventListener('mousedown', function(e) {
            isDragging = true;
            startDragY = e.clientY;
            startScrollY = currentScrollY;
            isAutoScrolling = false;
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            var diff = startDragY - e.clientY;
            currentScrollY = startScrollY + diff;
            if (currentScrollY < 0) currentScrollY = 0;
            if (currentScrollY > maxScrollY) currentScrollY = maxScrollY;
            updateTransform(currentScrollY, false);
        });

        window.addEventListener('mouseup', function(e) {
            isDragging = false;
            if (resumeAutoScrollTimer) clearTimeout(resumeAutoScrollTimer);
            resumeAutoScrollTimer = setTimeout(function() { isAutoScrolling = true; }, 6000);
        });
    </script>
</body>
</html>
