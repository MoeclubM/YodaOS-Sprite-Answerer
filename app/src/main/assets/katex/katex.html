<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <script src="file:///android_asset/katex/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000000 !important;
        }
        body, html {
            background-color: #000000;
            color: #00ff66;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 13.5px;
            /* 增大行高，为上下高分式/根号/矩阵预留充分的垂直排版空间，杜绝上下截断遮挡 */
            line-height: 1.8;
            padding: 4px 6px 120px 6px;
            overflow-x: hidden;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }
        p, div, span, li, h1, h2, h3, table, td, th {
            color: #00ff66 !important;
        }
        /* 核心公式垂直高度与自适应换行保护 */
        .katex {
            color: #00ff66 !important;
            font-size: 1.08em;
            line-height: 1.6 !important;
            white-space: normal !important;
            word-wrap: break-word !important;
            /* 预留上下外边距，防止上下高极限/上下标被上一行文字削头或遮挡 */
            padding-top: 3px !important;
            padding-bottom: 3px !important;
        }
        .katex-html {
            white-space: normal !important;
            display: inline-block !important;
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            /* 保证上下伸缩符号完整展现 */
            overflow-y: visible !important;
        }
        .katex-display {
            margin: 0.6em 0 !important;
            padding: 4px 0 !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            /* 确保高矩阵、双重分式、积分上下限垂直方向 100% 完整绘制，不发生裁剪 */
            overflow-y: visible !important;
            white-space: normal !important;
        }
        .katex-display > .katex {
            white-space: normal !important;
            text-align: left !important;
            display: block !important;
        }
        .bold-title {
            font-weight: bold;
            color: #00ff66;
            margin-top: 6px;
            margin-bottom: 2px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        var autoScrollTimer = null;
        var isAutoScrolling = false;
        var resumeAutoScrollTimer = null;

        function parseSimpleMarkdown(md) {
            if (!md) return '';
            var lines = md.split('\n');
            var html = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                line = line.replace(/\*\*(.*?)\*\*/g, '<span class="bold-title">$1</span>');
                line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html.push(line);
            }
            return html.join('<br>');
        }

        function renderMarkdown(md) {
            var container = document.getElementById('content');
            if (!md || !md.trim()) {
                container.innerHTML = '';
                return;
            }
            try {
                container.innerHTML = parseSimpleMarkdown(md);
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                container.innerText = md;
            }

            startAutoScrollIfNeeded();
        }

        function startAutoScrollIfNeeded() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            // 延时 3.5 秒先让用户阅读首屏要点，超屏后以 0.5px/50ms (极缓极稳约 10px/s) 平滑微步滚动
            setTimeout(function() {
                var scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight;
                var clientHeight = window.innerHeight;
                if (scrollHeight > clientHeight + 30) {
                    isAutoScrolling = true;
                    autoScrollTimer = setInterval(function() {
                        if (!isAutoScrolling) return;
                        var current = window.pageYOffset || document.documentElement.scrollTop;
                        var maxScroll = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;
                        if (current >= maxScroll - 2) {
                            clearInterval(autoScrollTimer);
                            autoScrollTimer = null;
                            isAutoScrolling = false;
                        } else {
                            window.scrollBy({ top: 0.5, behavior: 'auto' });
                        }
                    }, 50);
                }
            }, 3500);
        }

        // 手动触控滚动接口：即时平滑滚动指定像素
        window.manualScroll = function(deltaY) {
            // 用户一旦手动干预，立即暂停自动滚动 6 秒
            isAutoScrolling = false;
            if (resumeAutoScrollTimer) {
                clearTimeout(resumeAutoScrollTimer);
            }
            
            // 极速平滑滚动
            window.scrollBy({ top: deltaY, behavior: 'smooth' });
            
            resumeAutoScrollTimer = setTimeout(function() {
                isAutoScrolling = true;
            }, 6000);
        };
    </script>
</body>
</html>
