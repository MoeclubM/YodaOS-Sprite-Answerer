<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <script src="file:///android_asset/katex/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000000 !important;
        }
        body, html {
            background-color: #000000;
            color: #00ff66;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 15px;
            line-height: 1.5;
            padding: 4px 6px 12px 6px;
            overflow-x: hidden;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        p, div, span, li, h1, h2, h3, table, td, th {
            color: #00ff66 !important;
        }
        .katex {
            color: #00ff66 !important;
            font-size: 1.15em;
        }
        .katex-display {
            margin: 0.4em 0 !important;
        }
        .bold-title {
            font-weight: bold;
            color: #00ff66;
            margin-top: 6px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        function parseSimpleMarkdown(md) {
            if (!md) return '';
            var lines = md.split('\n');
            var html = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                line = line.replace(/\*\*(.*?)\*\*/g, '<span class="bold-title">$1</span>');
                line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html.push(line);
            }
            return html.join('<br>');
        }

        function renderMarkdown(md) {
            var container = document.getElementById('content');
            if (!md || !md.trim()) {
                container.innerHTML = '';
                return;
            }
            try {
                container.innerHTML = parseSimpleMarkdown(md);
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                container.innerText = md;
            }
        }
    </script>
</body>
</html>
