<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <script src="file:///android_asset/katex/auto-render.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #00ff66;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 13.5px;
            line-height: 1.5;
            padding: 4px 6px 140px 6px;
            overflow-x: hidden;
            overflow-y: auto;
            word-wrap: break-word;
            word-break: break-word;
            box-sizing: border-box;
        }

        p, div, span, li, h1, h2, h3, table, td, th {
            color: #00ff66;
        }

        .para {
            margin-bottom: 4px;
            line-height: 1.5;
        }

        /* 统一 KaTeX 荧光绿配色与官方高精度几何布局 */
        .katex {
            color: #00ff66 !important;
            font-size: 1.08em;
            white-space: normal !important;
            word-wrap: break-word !important;
            display: inline-block;
        }

        .katex-html {
            white-space: normal !important;
            display: inline-block !important;
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            overflow-y: visible !important;
        }

        /* 核心修复：100% 遵循 KaTeX 官方精确计算的分数线位置与 0.04em 标准纤细粗细，仅赋予荧光绿颜色，绝不破坏物理几何位置！ */
        .katex .frac-line, .katex-display .frac-line {
            border-bottom-color: #00ff66 !important;
            border-bottom-style: solid !important;
            border-bottom-width: 0.04em !important;
            min-height: 1px !important;
            display: inline-block !important;
            width: 100% !important;
            background-color: transparent !important;
        }

        /* 根号与开方符号 */
        .katex .sqrt-line {
            border-top-color: #00ff66 !important;
            border-top-style: solid !important;
            border-top-width: 0.04em !important;
            background-color: transparent !important;
        }

        .katex .mord, .katex .mbin, .katex .mrel, .katex .mopen, .katex .mclose, .katex .mpunct, .katex .minner, .katex .mop {
            color: #00ff66 !important;
        }

        .katex-display {
            margin: 0.3em 0 !important;
            padding: 2px 0 !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: visible !important;
            white-space: normal !important;
        }

        .katex-display > .katex {
            white-space: normal !important;
            text-align: left !important;
            display: block !important;
        }

        .bold-title {
            font-weight: bold;
            color: #00ff66;
            margin-top: 4px;
            margin-bottom: 2px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        var autoScrollTimer = null;
        var isAutoScrolling = false;
        var resumeAutoScrollTimer = null;

        function parseCompactMarkdown(md) {
            if (!md) return '';
            var lines = md.split('\n');
            var html = [];
            var lastWasEmpty = false;
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) {
                    if (!lastWasEmpty) {
                        lastWasEmpty = true;
                    }
                    continue;
                }
                lastWasEmpty = false;
                line = line.replace(/\*\*(.*?)\*\*/g, '<span class="bold-title">$1</span>');
                line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html.push('<div class="para">' + line + '</div>');
            }
            return html.join('');
        }

        function renderMarkdown(md) {
            var container = document.getElementById('content');
            if (!md || !md.trim()) {
                container.innerHTML = '';
                return;
            }
            try {
                container.innerHTML = parseCompactMarkdown(md);
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(container, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                container.innerText = md;
            }

            startAutoScrollIfNeeded();
        }

        function startAutoScrollIfNeeded() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            // 延时 3.5 秒首屏静止，随后以 0.35px/50ms 极稳超缓滚动
            setTimeout(function() {
                var scrollHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
                var clientHeight = window.innerHeight;
                if (scrollHeight > clientHeight + 20) {
                    isAutoScrolling = true;
                    autoScrollTimer = setInterval(function() {
                        if (!isAutoScrolling) return;
                        var current = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                        var maxScroll = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - window.innerHeight;
                        if (current >= maxScroll - 2) {
                            clearInterval(autoScrollTimer);
                            autoScrollTimer = null;
                            isAutoScrolling = false;
                        } else {
                            window.scrollBy(0, 0.35);
                        }
                    }, 50);
                }
            }, 3500);
        }

        // 高度精准的手动滚动接口
        window.manualScroll = function(deltaY) {
            isAutoScrolling = false;
            if (resumeAutoScrollTimer) {
                clearTimeout(resumeAutoScrollTimer);
            }
            
            window.scrollBy(0, deltaY);
            
            resumeAutoScrollTimer = setTimeout(function() {
                isAutoScrolling = true;
            }, 6000);
        };
    </script>
</body>
</html>
