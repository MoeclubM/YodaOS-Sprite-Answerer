name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Inject Secrets Configuration
        run: |
          mkdir -p app/src/main/java/com/rokid/aranswerer
          cat << 'EOF' > app/src/main/java/com/rokid/aranswerer/AppSecrets.kt
          package com.rokid.aranswerer

          object AppSecrets {
              const val PRIMARY_API_BASE = "${{ secrets.PRIMARY_API_BASE }}"
              const val PRIMARY_API_KEY = "${{ secrets.PRIMARY_API_KEY }}"

              const val DEEPSEEK_API_BASE = "${{ secrets.DEEPSEEK_API_BASE }}"
              const val DEEPSEEK_API_KEY = "${{ secrets.DEEPSEEK_API_KEY }}"
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Answerer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
